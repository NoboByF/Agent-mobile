name: Build LivePilot AI Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses & Prepare SDK
        run: |
          SDK_MGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager: $SDK_MGR"
          yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
          "$SDK_MGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDK_MGR" "platforms;android-36.1" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate personal release upload keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "livepilot1234" \
            -keypass "livepilot1234" \
            -dname "CN=LivePilot AI, OU=Personal, O=LivePilot, L=Dhaka, ST=Dhaka, C=BD"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: livepilot1234
          KEY_PASSWORD: livepilot1234
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload LivePilot AI Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LivePilot-AI-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
